<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>WorkShop website</title>
</head>
<body>
    <h1>
        Esercizio
    </h1>
    <div class="input_class">

        <input type="text" placeholder="Nome" id="mioInput">

        
        <p id="risultato_testo">
            
        </p>

        <br>
        <button class="" onclick="mostraNome()">
            Mostra benvenuto 
        </button>

        <button onclick="cambiaColore()">
            Cambia colore
        </button>

        <button onclick="coloreDefault()">
            Reset schermo
        </button>

        <div class="autors">

            by Ernesto and Yehor <br>
            1th of September 2026
        </div>
        
    </div>

    <script>
            function mostraNome() {
            let testo = document.getElementById("mioInput").value.trim();
    
            let paragrafo = document.getElementById("risultato_testo");

            if (testo === "") {
                paragrafo.innerText = "Inserisci qualcosa!";
        
            } 
            else {
               paragrafo.innerText = "Ciao, " + testo;
            }

                                }


        
        const colori = ["green", "red", "blue", "orange"];
        let click = 0;

        function cambiaColore() {
            document.body.style.backgroundColor = colori[click % colori.length];
            click++; 
        }


        function coloreDefault() {
            
            document.body.style.backgroundColor = "white"            
        }
    
    </script>
</body>
</html>
